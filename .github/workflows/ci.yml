name: CI

# Sin filtros de rutas (paths): Render espera estos checks y un workflow
# omitido contaría como aprobado (ver ADR-0004).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
            - name: Construir la imagen de producción
        run: docker build -t coachlink-api:ci .
      - name: Comprobar que la imagen responde /health
        run: |
          docker run -d --name api -p 3000:3000 coachlink-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          echo "La imagen no respondió /health en 30 s" >&2
          docker logs api
          exit 1
      - name: Comprobar que la imagen no incluye tsx
        run: docker run --rm --entrypoint sh coachlink-api:ci -c 'test ! -e node_modules/.bin/tsx'
